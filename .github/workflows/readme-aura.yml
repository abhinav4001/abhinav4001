name: Generate README

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - 'scripts/fetch-gitskins.mjs'
      - '.github/assets/city.svg'
      - '.github/assets/heatmap.svg'
      - '.github/assets/readme-aura-component-*.svg'
      - 'fonts/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and recolour contribution images
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/fetch-gitskins.mjs

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fonts_dir: fonts
          github_user: abhinav4001
